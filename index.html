<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.png" />
    <title>Lightyears Educational Consultancy</title>

    <meta name="description" content="Lightyears Educational Consultancy guides Bangladeshi students through every step of applying to universities in the UK, US, Canada, Australia and beyond. Book a consultation today.">

    <meta property="og:title" content="Lightyears Educational Consultancy">
    <meta property="og:description" content="Personal, honest guidance for Bangladeshi students applying abroad.">
    <meta property="og:url" content="https://www.lightyearsconsultancy.com">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .gradient-text {
        background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
          -webkit-text-fill-color: transparent;
      }
      .bg-primary {
        background-color: #00153A;
      }
      .text-primary {
        color: #00153A;
      }
      .border-primary {
        border-color: #00153A
      }

      .pop-blue{
        color: #3156ED
      }

      .body-text{
        font-size: 16px;
        line-height: 24px;
      }
      @media (min-width: 768px) {
        .body-text {
          font-size: 18px;
        }
      }
      .button-text{
        font-size: 14px;
        line-height: 24px;
        font-weight: 500;
      }
      .bg-pop-blue{
        background-color: #3156ED;
      }

      .header-text{
        font-size: 32px;
        line-height: 40px;
        font-weight: 800;
      }
      @media (min-width: 768px) {
        .header-text {
          font-size: 44px;
          line-height: 48px;
        }
      }

      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Animation keyframes */
      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0px);
        }
      }
      .animate-float {
        animation: float 4s ease-in-out infinite;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-white text-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
